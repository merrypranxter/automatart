name: Build and smoke-test Automatart
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Type-check and production build
        run: npm run build
      - name: Audit real activity across all 17 automata (diagnostic, no pass-rate mandate)
        run: node scripts/engine-activity-atlas.mjs
      - name: Verify eight deterministic CA engines
        run: node scripts/mutant-engines-smoke.mjs
      - name: Verify topology, reversible CA, and directional rules
        run: node scripts/z3-topology-smoke.mjs
      - name: Verify shared palette library
        run: node scripts/palette-smoke.mjs
      - name: Funhouse rules, palette motion, and invented colors
        run: node scripts/funhouse-smoke.mjs
      - name: Verify deterministic mutation dice and locks
        run: node scripts/mutation-smoke.mjs
      - name: Verify Alien Paintbrush geometry and saved specimens
        run: node scripts/alien-paint-smoke.mjs
      - name: Verify portable palette JSON exchange
        run: node --experimental-strip-types scripts/palette-exchange-smoke.mjs
      - name: Install headless canvas and GIF decoder for export smoke test
        run: npm install --no-save --no-audit --no-fund @napi-rs/canvas gifuct-js
      - name: Encode and decode a truly animated GIF
        run: node scripts/recording-smoke.mjs
      - name: Regression test GIF color cycling versus live render
        run: node scripts/gif-color-cycle-smoke.mjs
      - name: Verify mathematical skins and history overlays
        run: node scripts/skin-smoke.mjs
      - name: Verify ten real color signals and mathematical inspector
        run: node scripts/a1-color-signals-smoke.mjs
      - name: Verify B1 genuine expanded neighborhoods and transitions
        run: node scripts/b1-neighborhood-smoke.mjs
      - name: Verify B2 hand-painted neighbor stencils and mathematics
        run: node scripts/b2-stencil-smoke.mjs
      - name: Verify C1 canonical circuits, sandpile conservation and JSON/recorder parity
        run: node scripts/c1-circuits-smoke.mjs
      - name: Verify C2 Hodgepodge waves, seeded forest fires and export replay
        run: node scripts/c2-reaction-smoke.mjs
      - name: Verify C3 Ising energy, Turmite agent trajectories and snapshot replay
        run: node scripts/c3-spins-turmites-smoke.mjs
      - name: Verify nine aspect ratios, real tall worlds, fitted/cropped video and 8K PNG geometry
        run: node scripts/z-export-frames-smoke.mjs
      - name: Verify T1 four-turn 24-state Turmite genome, real microsteps and exact replay
        run: node scripts/dynamics-t1-turmite-genome-smoke.mjs
      - name: Verify T2 heading-conditioned multi-species Turmite collision mathematics and old save compatibility
        run: node scripts/dynamics-t2-mutant-turmites-smoke.mjs
      - name: Verify T3 separate Turmite turn/write genomes, real erasure/jumps and safe manual placement
        run: node scripts/dynamics-t3-write-program-smoke.mjs
      - name: Verify T4 genuine per-species pigment chemistry and same-site encounter reactions
        run: node scripts/dynamics-t4-collision-alchemy-smoke.mjs
      - name: Verify T5 per-ant finite-state memory, feedback, saved histories and recording
        run: node scripts/dynamics-t5-memory-ants-smoke.mjs
      - name: Verify T6 true chemical fields, diffusion, chemotaxis and persistent recipes
        run: node scripts/dynamics-t6-pheromone-gravity-smoke.mjs
      - name: Verify T7 rival chemical species, real cross-reactions and no prematurely settled exports
        run: node scripts/dynamics-t7-chemical-civil-war-smoke.mjs
      - name: Verify T8 true spatially coupled ant phase oscillators, live pigment feedback and saved replay
        run: node scripts/dynamics-t8-kuramites-smoke.mjs
      - name: Verify T9 true metabolic ant lifecycles, stable births/deaths and exact preserved recipes
        run: node scripts/dynamics-t9-swarm-life-smoke.mjs
      - name: Verify T10 real heritable genomes, mutation selection, birth ancestry and exact recipe replay
        run: node scripts/dynamics-t10-genetic-drift-smoke.mjs
      - name: Verify T11 real physical contact-driven gene exchange, old-cell gates and exact saved replay
        run: node scripts/dynamics-t11-gene-spill-smoke.mjs
      - name: Verify T12 genuine extracellular DNA fossils, delayed absorption and preserved field replay
        run: node scripts/dynamics-t12-dna-fossils-smoke.mjs
      - name: Verify C4 HPP conservation, boundaries, wall painting, recipes and recording
        run: node scripts/c4-hpp-smoke.mjs
      - name: Verify D1a true rhombille tile edge graph, tap projection and CA compatibility
        run: node scripts/d1a-rhombille-smoke.mjs
      - name: Test Cyclic A1 calibrated starter worlds, physical structure and exact replay
        run: node scripts/dynamics-a1-presets-smoke.mjs
      - name: Verify B8 canonical NOR/three-input NAE and five alternate true CA head-count spectra
        run: node scripts/dynamics-b8-threshold-smoke.mjs
      - name: Verify B9 genuine two-stage NAND to synchronized NOT to AND physical signals and recipe replay
        run: node scripts/dynamics-b9-cascade-smoke.mjs
      - name: Verify B10 genuine bias path-length phase mutation and all four-state output fingerprints
        run: node scripts/dynamics-b10-phase-smoke.mjs
      - name: Verify B11 return-wave guard collision, exact AND preservation and all rotational feedback probes
        run: node scripts/dynamics-b11-feedback-smoke.mjs
      - name: Profile Cyclic A1 structural viability across multiple widths and seeds
        run: node scripts/dynamics-a1-cyclic-viability.mjs
      - name: Verify Dynamics P1 classic cyclic rule, chase sensitivity and seeded activity
        run: node scripts/dynamics-cyclic-smoke.mjs
      - name: Verify Dynamics A2 real wave pacemakers, seeded sparks and pure-rule preservation
        run: node scripts/dynamics-a2-waves-smoke.mjs
      - name: Verify A3 territorial births, invasions and directional matches against production stepper
        run: node scripts/dynamics-a3-territory-smoke.mjs
      - name: Verify B2 16-state bijective Margolus maps, live-rule rewind, legacy saves and recording
        run: node scripts/dynamics-b2-reversible-smoke.mjs
      - name: Verify Dynamics B1 canonical Brian's Brain, electrodes, recording and recipe replay
        run: node scripts/dynamics-b1-brain-smoke.mjs
      - name: Verify B3 canonical Wireworld circuits, real electrical sources, JSON replay and recording
        run: node scripts/dynamics-b3-wire-smoke.mjs
      - name: Verify B4 Wireworld genuine Boolean OR and fanout signal truth tables, rotation and saved replay
        run: node scripts/dynamics-b4-wire-logic-smoke.mjs
      - name: Verify B5 canonical XOR dual-contact cancellation and exact non-destructive signal scope
        run: node scripts/dynamics-b5-xor-scope-smoke.mjs
      - name: Verify B6 real Wireworld routing, dual lanes, pulse trains and stage timing scope
        run: node scripts/dynamics-b6-wire-timing-smoke.mjs
      - name: Verify B7 physical canonical NAND/NOT inhibition truth tables and rotated real-world circuits
        run: node scripts/dynamics-b7-inhibition-smoke.mjs
      - name: Verify A2 dual-source mathematical color mixing and exports
        run: node scripts/a2-dual-color-smoke.mjs
      - name: Verify Print Shop effects, compositing and recipe migration
        run: node scripts/printshop-smoke.mjs
      - name: Verify high-res PNG snapshots and legacy recipe safety
        run: node scripts/f5-snapshot-smoke.mjs

      - name: Install Chromium and browser automation for recorder UI test
        run: |
          npm install --no-save --no-audit --no-fund playwright gifuct-js
          npx playwright install --with-deps chromium
      - name: Record GIF through actual browser Worker and verify UI
        run: node scripts/recorder-browser-smoke.mjs
      - name: Verify smooth real-time video capture in Chromium
        run: node scripts/video-recorder-browser-smoke.mjs
