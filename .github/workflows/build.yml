name: Build and smoke-test Automatart
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Type-check and production build
        run: npm run build
      - name: Verify eight deterministic CA engines
        run: node scripts/mutant-engines-smoke.mjs
      - name: Verify topology, reversible CA, and directional rules
        run: node scripts/z3-topology-smoke.mjs
      - name: Verify shared palette library
        run: node scripts/palette-smoke.mjs
      - name: Funhouse rules, palette motion, and invented colors
        run: node scripts/funhouse-smoke.mjs
      - name: Verify deterministic mutation dice and locks
        run: node scripts/mutation-smoke.mjs
      - name: Verify Alien Paintbrush geometry and saved specimens
        run: node scripts/alien-paint-smoke.mjs
      - name: Verify portable palette JSON exchange
        run: node --experimental-strip-types scripts/palette-exchange-smoke.mjs
      - name: Install headless canvas and GIF decoder for export smoke test
        run: npm install --no-save --no-audit --no-fund @napi-rs/canvas gifuct-js
      - name: Encode and decode a truly animated GIF
        run: node scripts/recording-smoke.mjs
      - name: Regression test GIF color cycling versus live render
        run: node scripts/gif-color-cycle-smoke.mjs
      - name: Verify mathematical skins and history overlays
        run: node scripts/skin-smoke.mjs
      - name: Verify Print Shop effects, compositing and recipe migration
        run: node scripts/printshop-smoke.mjs

      - name: Install Chromium and browser automation for recorder UI test
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium
      - name: Record GIF through actual browser Worker and verify UI
        run: node scripts/recorder-browser-smoke.mjs
      - name: Verify smooth real-time video capture in Chromium
        run: node scripts/video-recorder-browser-smoke.mjs
